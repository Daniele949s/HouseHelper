name: HouseHelper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static security and hygiene checks
        run: |
          npm run check:emojis
          npm run check:circular
          npm run audit:secrets

      - name: Run Jest unit and integration tests
        run: CI=true npm test -- --watchAll=false src/components/DesktopNavigation.test.jsx src/components/MobileBottomBar.test.jsx src/components/MobileNavigation.test.jsx src/components/HouseholdStatus.test.jsx src/test/household_roles.test.jsx src/test/tier2_boundaries/security_rules.test.js src/test/tier3_interactions/cross_feature.test.jsx

      - name: Run Firebase Emulator Suite Security Rules tests
        run: npx -y firebase-tools emulators:exec --only auth,firestore --project househelper-12050 "node scripts/test-firestore-rules-emulator.mjs"

      - name: Production build check
        run: CI=true npm run build
